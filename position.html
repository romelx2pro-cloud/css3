<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        position: relative;
        border: 1px solid red;
        background-color: bisque;
      }
      .box {
        width: 200px;
        height: 200px;
        background-color: steelblue;
        margin: 5px;
      }
      .box-2 {
        /* position: relative; */
        /* left: 180px; */
        /* z-index: 2; */
        position: absolute;
        top: 50px;
        left: 50px;
        background-color: aqua;
      }
      .box-3 {
        z-index: 1;
        border: 1px solid tomato;
      }
    </style>
  </head>
  <body>
    <h1>Position</h1>
    <h2>More position</h2>
    <section class="container">
      <div class="box box-1">
        <h2>box-1</h2>
      </div>
      <div class="box box-2">
        <h2>box-2</h2>
      </div>
      <div class="box box-3">
        <h2>box-3</h2>
      </div>
      <div class="box box-4">
        <h2>box-4</h2>
      </div>
    </section>
  </body>
</html>
